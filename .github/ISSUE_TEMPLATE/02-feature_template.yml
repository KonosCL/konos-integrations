name: Feature request
description: Do you have an improvement idea? Let us know
title: "[BANCH] module: description"
labels: ["enhancement"]
assignees:
  - alxolivares
body:
  - type: input
    id: version
    attributes:
      label: Impacted version
      description: Branch where you want us to enable the new feature.
      placeholder: E.g. 17.0
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Is your feature request related to a problem?
      description: If so, please provide clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the feature request here.
    validations:
      required: false
